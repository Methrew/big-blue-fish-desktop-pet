name: macOS package
on:
  push:
    branches: [main, 'build/macos-*']
    paths: [Version.props, 'code/**', '!code/**/*.md', 'tools/**', .github/workflows/macos-package.yml]
  pull_request:
    paths: [Version.props, 'code/**', '!code/**/*.md', 'tools/**', .github/workflows/macos-package.yml]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft Release tag to receive the verified packages; empty builds only
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    # Builds and verifies with a read-only token that is not kept in the checkout; nothing here can write to the repository.
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        edition: [Standard, Safe]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Build self-contained application
        run: |
          test "$(uname -m)" = arm64
          bash tools/build-macos.sh '${{ matrix.edition }}' "$RUNNER_TEMP/app-output"
      - name: Verify application and package DMG
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          # App name and asset prefix come from CompanionEdition.cs, the same identity build-macos.sh uses.
          { read -r title; read -r safe_title; read -r prefix; } < <(python3 tools/Get-EditionIdentity.py DisplayName SafeDisplayName AssetPrefix)
          suffix=''
          if [[ $EDITION == Safe ]]; then title=$safe_title; suffix=-Safe; fi
          app="$RUNNER_TEMP/app-output/$title.app"
          python3 tools/Verify-MacPackage.py "$app" --edition "$EDITION" --output "$RUNNER_TEMP/verification"
          stage=$(mktemp -d "$RUNNER_TEMP/dmg-stage.XXXXXXXX")
          ditto "$app" "$stage/$title.app"
          ln -s /Applications "$stage/Applications"
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Version.props)
          name="${prefix}-v${version}${suffix}-macOS-arm64.dmg"
          mkdir -p "$RUNNER_TEMP/packages"
          hdiutil create -volname 'BigBlueFish' -srcfolder "$stage" -format UDZO "$RUNNER_TEMP/packages/$name"
          hdiutil verify "$RUNNER_TEMP/packages/$name"
          (cd "$RUNNER_TEMP/packages"; shasum -a 256 "$name" > "$name.sha256")
          python3 - "$RUNNER_TEMP/packages/$name" "$RUNNER_TEMP/verification/package.json" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          pathlib.Path(sys.argv[2]).write_text(json.dumps(dict(name=p.name,bytes=p.stat().st_size,sha256=digest),indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.edition }}-package
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-${{ matrix.edition }}-verification
          path: ${{ runner.temp }}/verification
          if-no-files-found: ignore
  upload:
    # Only this job can write, and only to an existing draft Release: a build branch push uses the tag of Version.props,
    # a manual run the tag it names. Pull requests never reach it.
    needs: package
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/build/macos-')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: Version.props
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: macOS-*-package
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Upload verified packages to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag=$INPUT_TAG
          if [[ -z $tag ]]; then tag="v$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Version.props)"; fi
          cd "$RUNNER_TEMP/packages"
          shasum -a 256 -c ./*.sha256
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" ./* --repo "$GITHUB_REPOSITORY"
